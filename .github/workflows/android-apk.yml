# Builds the World Fracture Android app and publishes the APK as the "android-latest" GitHub release, so it can be installed straight
# from a phone. The whole game is built as a static single-page app (WF_MOBILE=1) and shipped inside the APK (mobile/, Capacitor), so
# it plays without a server or a Lovable login; cloud saves still sync over the network when you sign in.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  # a fresh build of the newest game every night (the game itself changes many times a day)
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - name: Build the game as a static app
        run: |
          bun install --frozen-lockfile
          bun scripts/bake-terrain-maps.ts # the map images, painted from this exact terrain (a few minutes)
          WF_MOBILE=1 npx vite build
          rm -rf mobile/www && cp -r .output/public mobile/www
          rm -rf mobile/www/refs mobile/www/server
          cp mobile/www/_shell.html mobile/www/index.html
          du -sh mobile/www

      - name: Install Capacitor
        working-directory: mobile
        run: npm ci

      - name: Sync the Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/WorldFracture.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest WorldFracture.apk \
            --title "World Fracture for Android (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your Android phone, tap WorldFracture.apk, and allow installs from your browser when asked. The whole game is inside the app (about 250 MB): it plays full screen in landscape without a server; sign in from the menu to sync your cloud save. A new build is published every night." \
            --prerelease
