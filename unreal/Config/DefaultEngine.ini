[/Script/EngineSettings.GameMapsSettings]
; Until World Fracture's own levels exist, the game starts in the engine's default template level.
; AWFGameMode also adds a floor and lights if the level it lands in has none, so any empty level plays.
GameDefaultMap=/Engine/Maps/Templates/Template_Default.Template_Default
EditorStartupMap=/Engine/Maps/Templates/Template_Default.Template_Default
GlobalDefaultGameMode=/Script/WorldFracture.WFGameMode

[/Script/Engine.RendererSettings]
; ---- realistic rendering on PC (UE5's own systems) ----
; Lumen: real-time bounced light (global illumination) and reflections, from the sun, sky and every street light
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=1
; software Lumen traces mesh distance fields, so every mesh needs one
r.GenerateMeshDistanceFields=True
; set to True on an RTX card for hardware ray-traced Lumen (sharper reflections, better GI); needs r.RayTracing
r.Lumen.HardwareRayTracing=False
r.RayTracing=False
; Virtual Shadow Maps: crisp, film-quality shadows all the way out
r.Shadow.Virtual.Enable=1
; Nanite: film-density geometry for the imported buildings (tools/setup_assets.py turns it on per mesh)
r.Nanite.ProjectEnabled=True
; Temporal Super Resolution: UE5's upscaler and anti-aliasing
r.AntiAliasingMethod=4
; physically based sky, volumetric clouds and volumetric fog (WFAtmosphere)
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
r.VolumetricFog=1
r.VolumetricCloud=1
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=True
r.CustomDepth=3

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

; ---- Android (Samsung Galaxy S22 Ultra is the first test phone) ----
; One self-contained APK (game data inside the APK, no separate OBB), so it installs straight from a download.
[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
PackageName=com.worldfracture.game
StoreVersion=1
VersionDisplayName=0.1
Orientation=SensorLandscape
bFullScreen=True
bPackageDataInsideApk=True
bBuildForArm64=True
bBuildForX8664=False
bSupportsVulkan=True
bBuildForES31=True
bEnableGooglePlaySupport=False

; Mobile deferred shading: Nexus City's pooled street and sign lights all reach the same instanced buildings (mobile
; forward caps movable lights per mesh at 4).
[/Script/Engine.RendererSettings]
r.Mobile.ShadingPath=1
r.Mobile.AllowDeferredShadingOpenGL=False
; phones: the sky atmosphere and volumetric clouds also run on the mobile renderer (WFAtmosphere keeps volumetric fog
; and motion blur off there); distance field shadows for soft long shadows on high-end phones
r.Mobile.AllowDistanceFieldShadows=True
r.Mobile.AmbientOcclusion=True
