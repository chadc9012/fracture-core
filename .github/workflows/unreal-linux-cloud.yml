# Builds the Unreal Engine version of World Fracture for Linux in the cloud and publishes it as the "unreal-linux-latest"
# GitHub release (a zip: unpack, run WorldFracture.sh). Epic's engine images are Installed Builds that package for Linux
# only, so this is the cloud build that can finish; the Android APK needs the PC workflow (Unreal Android APK).
#
# It runs Epic's official Unreal Engine container (ghcr.io/epicgames/unreal-engine). Epic only lets accounts that have
# accepted its EULA pull it, so before the first run the repo owner:
#   1. links their Epic Games account to GitHub (epicgames.com > Account > Apps and Accounts > GitHub) and accepts the
#      invitation to the EpicGames organization;
#   2. makes a classic personal access token with only `read:packages` and saves it as the repository secret
#      EPIC_GHCR_TOKEN (Settings > Secrets and variables > Actions).
# Then: Actions > "Unreal Linux build (cloud)" > Run workflow.
#
# The engine image is tens of GB. The standard GitHub machine is cleared of its preinstalled tools to make room; if a run
# still runs out of disk, set `runner` to a larger GitHub machine (paid per minute) when starting it.
name: Unreal Linux build (cloud)

on:
  workflow_dispatch:
    inputs:
      engine_image:
        description: "Unreal Engine container (Epic's ghcr.io images; dev-slim is the smallest that can package)"
        default: "ghcr.io/epicgames/unreal-engine:dev-slim-5.8"
      config:
        description: "Build configuration"
        type: choice
        options: [Development, Shipping]
        default: Development
      runner:
        description: "GitHub machine to run on"
        default: "ubuntu-latest"

permissions:
  contents: write

concurrency:
  group: unreal-linux-cloud
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350
    steps:
      - name: Make room for the engine
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup /opt/microsoft /usr/share/swift
          sudo docker image prune --all --force
          # docker keeps the engine image on the bigger /mnt disk
          sudo systemctl stop docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo mkdir -p /mnt/docker && sudo systemctl start docker
          df -h / /mnt

      - uses: actions/checkout@v4

      - name: Join the web build's models (one mesh per model)
        run: |
          sudo -E env "PATH=$PATH" bash scripts/setup-blender.sh # it installs to /opt and /usr/local/bin
          blender -b -P unreal/tools/join_models.py -- build/joined/buildings public/models/buildings/*.glb
          blender -b -P unreal/tools/join_models.py -- build/joined/fleet public/models/fleet/*.glb

      - name: Pull the Unreal Engine image
        env:
          EPIC_GHCR_TOKEN: ${{ secrets.EPIC_GHCR_TOKEN }}
        run: |
          if [ -z "$EPIC_GHCR_TOKEN" ]; then
            echo "::error::The EPIC_GHCR_TOKEN secret is missing: see the steps at the top of this workflow."; exit 1
          fi
          # errors go into annotations (one line each) so they can be read without the raw log
          if ! out=$(echo "$EPIC_GHCR_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin 2>&1); then
            echo "::error::docker login to ghcr.io failed: $(echo "$out" | tail -3 | tr '\n' ' ')"; exit 1
          fi
          if ! out=$(docker pull "${{ inputs.engine_image }}" 2>&1); then
            echo "::error::Could not pull ${{ inputs.engine_image }}: $(echo "$out" | tail -3 | tr '\n' ' ')"
            echo "::error::Usual causes: the Epic account not linked to GitHub, the EpicGames org invitation not accepted, the token missing read:packages, or no such tag."
            exit 1
          fi
          df -h /mnt

      - name: Build the materials and models, compile, cook and package for Linux
        run: |
          mkdir -p build/linux && chmod -R a+rwX "$PWD"
          # the engine refuses to run as root; the image's own user (ue4) builds, with the repo, SDK and JDK mounted in
          docker run --rm -u ue4 \
            -v "$PWD":/project -e WF_JOINED_MODELS=/project/build/joined \
            "${{ inputs.engine_image }}" bash -lc '
              set -euo pipefail
              ENGINE=/home/ue4/UnrealEngine # where the Epic dev images keep the engine (no apostrophes inside this single-quoted script)
              cd /project
              "$ENGINE/Engine/Build/BatchFiles/Linux/Build.sh" WorldFractureEditor Linux Development -project=/project/unreal/WorldFracture.uproject
              "$ENGINE/Engine/Binaries/Linux/UnrealEditor-Cmd" /project/unreal/WorldFracture.uproject -run=pythonscript -script=/project/unreal/tools/setup_assets.py -unattended -nullrhi -nosplash
              "$ENGINE/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun -project=/project/unreal/WorldFracture.uproject \
                -platform=Linux -clientconfig=${{ inputs.config }} \
                -build -cook -stage -package -pak -archive -archivedirectory=/project/build/linux -utf8output -nop4 -unattended
            '

      - name: Publish the Linux build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the archive holds WorldFracture.sh at its root (older engines nest it in a Linux* folder)
          SH=$(find build/linux -maxdepth 3 -name 'WorldFracture.sh' | head -1)
          DIR=${SH:+$(dirname "$SH")}
          [ -n "$DIR" ] || { echo "::error::no Linux build was archived"; ls -R build/linux | head -50; exit 1; }
          (cd "$DIR" && zip -qr "$GITHUB_WORKSPACE/WorldFractureUE-Linux.zip" .)
          gh release view unreal-linux-latest > /dev/null 2>&1 || gh release create unreal-linux-latest --prerelease \
            --title "World Fracture (Unreal) - Linux" \
            --notes "Unreal Engine build for Linux x64, from the latest main. Unzip and run WorldFracture.sh."
          gh release upload unreal-linux-latest WorldFractureUE-Linux.zip --clobber
          echo "Published $(du -h WorldFractureUE-Linux.zip | cut -f1)"
